<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social App API - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-800 font-sans antialiased">

  <!-- Navigation Bar -->
  <header class="bg-white shadow sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between border-b border-gray-100">
      <h1 class="text-xl font-bold text-indigo-600">SocialApp</h1>

      <!-- Search Input -->
      <div class="w-1/3">
        <input id="searchInput" type="text" placeholder="Search posts by author, title, tags..."
          class="w-full px-3 py-1.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <!-- Auth Action State -->
      <div id="authActions" class="flex items-center space-x-3">
        
      </div>
    </div>

    <!-- Authenticated Sub-Navigation Top Bar (Hidden for guests) -->
    <nav id="authenticatedTopBar" class="bg-gray-50 border-b border-gray-200 hidden">
      <div class="max-w-6xl mx-auto px-4 py-2 flex flex-wrap items-center justify-between gap-3">
        
        <!-- Pills Navigation -->
        <div class="flex items-center space-x-2 text-xs font-semibold">
          <button id="pill-all-posts" onclick="switchFeedTab('all')" 
                  class="px-3.5 py-1.5 rounded-full bg-indigo-600 text-white shadow-sm transition">
            Posts
          </button>

          <button id="pill-following" onclick="switchFeedTab('following')" 
                  class="px-3.5 py-1.5 rounded-full bg-white border border-gray-300 text-gray-700 hover:bg-gray-100 transition">
            Following <span id="followingCountBadge" class="ml-1 bg-gray-200 text-gray-700 px-1.5 py-0.2 rounded-full text-[10px]">0</span>
          </button>

          <button id="pill-followers" onclick="switchFeedTab('followers')" 
                  class="px-3.5 py-1.5 rounded-full bg-white border border-gray-300 text-gray-700 hover:bg-gray-100 transition">
            Followers <span id="followersCountBadge" class="ml-1 bg-gray-200 text-gray-700 px-1.5 py-0.2 rounded-full text-[10px]">0</span>
          </button>
        </div>

        <!-- User Search Bar -->
        <div class="relative w-full sm:w-64">
          <input id="userSearchInput" type="text" placeholder="Search users by @username..." 
                oninput="handleUserSearch(event)"
                class="w-full pl-8 pr-3 py-1.5 bg-white border border-gray-300 rounded-full text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <span class="absolute left-2.5 top-1.5 text-gray-400 text-xs">🔍</span>
          
          <!-- Dropdown for User Search Results -->
          <div id="userSearchResults" class="hidden absolute left-0 right-0 mt-1 bg-white border border-gray-200 rounded-xl shadow-lg z-50 max-h-60 overflow-y-auto p-2 space-y-1">
          </div>
        </div>

      </div>
    </nav>
  </header>

  <!-- Main Layout -->
  <main class="max-w-6xl mx-auto px-4 py-6 grid grid-cols-1 md:grid-cols-4 gap-6">

    <!-- Sidebar Filters -->
    <aside class="md:col-span-1 space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <h2 class="font-semibold text-gray-700 mb-3 text-sm uppercase">Order Feed By</h2>
        <select id="sortSelect" class="w-full p-2 border border-gray-300 rounded-lg text-sm bg-white">
          <option value="timestamp">Latest Posts</option>
          <option value="like_count">Most Liked</option>
          <option value="comment_count">Most Commented</option>
        </select>
      </div>

      <!-- Create Post Trigger (Authenticated Users) -->
      <button id="createPostBtn" onclick="openCreateModal()"
        class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-medium shadow hover:bg-indigo-700 transition">
        + Create New Post
      </button>
      <section id="myPostsSection" class="space-y-4 hidden">
      <!-- My Posts Header & Filters -->
      <div
        class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="text-lg font-bold text-gray-800">My Posts</h2>
          <p class="text-xs text-gray-500">Manage your published content and drafts</p>
        </div>

        <!-- State Filter Tabs -->
        <div class="flex bg-gray-100 p-1 rounded-lg text-xs font-medium">
          <button onclick="filterMyPosts('')" id="tab-all"
            class="px-3 py-1.5 rounded-md bg-white shadow-sm text-indigo-600">All</button>
          <button onclick="filterMyPosts('published')" id="tab-published"
            class="px-3 py-1.5 rounded-md text-gray-600 hover:text-indigo-600">Published</button>
          <button onclick="filterMyPosts('draft')" id="tab-draft"
            class="px-3 py-1.5 rounded-md text-gray-600 hover:text-indigo-600">Drafts</button>
        </div>
      </div>

      <!-- User Posts Container -->
      <div id="myPostsContainer" class="space-y-4">
        <div class="text-center py-8 text-gray-500">Loading your posts...</div>
      </div>
    </section>
    </aside>

    

    <!-- Post Feed -->
    <section class="md:col-span-3 space-y-4">
      <div id="postsFeed" class="space-y-4">
        <!-- Dynamic Posts populated by JS -->
        <div class="text-center py-8 text-gray-500">Loading published posts...</div>
      </div>

      <!-- Pagination Controls -->
      <div class="flex items-center justify-between bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <button id="prevBtn" onclick="changePage(-1)"
          class="px-4 py-1.5 border border-gray-300 rounded-lg text-sm hover:bg-gray-50 disabled:opacity-50">
          Previous
        </button>
        <span id="pageIndicator" class="text-sm font-medium text-gray-600">Page 1</span>
        <button id="nextBtn" onclick="changePage(1)"
          class="px-4 py-1.5 border border-gray-300 rounded-lg text-sm hover:bg-gray-50 disabled:opacity-50">
          Next
        </button>
      </div>
    </section>

    
  </main>

  <script src="js/app.js?v=1.0.2"></script>
  <!-- Auth Modal (Sign In / Sign Up) -->
  <div id="authModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6 relative">
      <button onclick="toggleAuthModal()"
        class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>

      <!-- Auth Mode Tabs -->
      <div class="flex border-b mb-4">
        <button id="loginTabBtn" onclick="switchAuthTab('login')"
          class="flex-1 py-2 font-semibold text-indigo-600 border-b-2 border-indigo-600">Sign In</button>
        <button id="signupTabBtn" onclick="switchAuthTab('signup')"
          class="flex-1 py-2 font-semibold text-gray-500 border-b-2 border-transparent hover:text-indigo-600">Sign
          Up</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-gray-700">Email or Username</label>
          <input type="text" id="loginIdentifier" required
            class="w-full mt-1 p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700">Password</label>
          <input type="password" id="loginPassword" required
            class="w-full mt-1 p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <button type="submit"
          class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 text-sm">Sign
          In</button>
      </form>

      <!-- Sign Up Form (Hidden by default) -->
      <form id="signupForm" onsubmit="handleSignup(event)" class="space-y-3 hidden">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-medium text-gray-700">First Name</label>
            <input type="text" id="signupFirstName" required
              class="w-full mt-1 p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700">Last Name</label>
            <input type="text" id="signupLastName" required
              class="w-full mt-1 p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700">Username</label>
          <input type="text" id="signupUsername" required
            class="w-full mt-1 p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700">Email</label>
          <input type="email" id="signupEmail" required
            class="w-full mt-1 p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700">Password</label>
          <input type="password" id="signupPassword" required
            class="w-full mt-1 p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <button type="submit"
          class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 text-sm">Create
          Account</button>
      </form>
    </div>
  </div>

  <!-- Create Post Modal -->
  <div id="createPostModal"
    class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-lg p-6 relative">
      <button onclick="closeCreateModal()"
        class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
      <h2 class="text-lg font-bold text-gray-800 mb-4">Create New Post</h2>

      <form id="createPostForm" onsubmit="handleCreatePost(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-gray-700">Title</label>
          <input type="text" id="postTitle" required placeholder="Post title..."
            class="w-full mt-1 p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700">Content</label>
          <textarea id="postContent" rows="4" required placeholder="What's on your mind?..."
            class="w-full mt-1 p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700">Tags (comma separated)</label>
          <input type="text" id="postTags" placeholder="nodejs, express, backend"
            class="w-full mt-1 p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div class="flex justify-end space-x-3 pt-2">
          <button type="button" onclick="closeCreateModal()"
            class="px-4 py-2 border rounded-lg text-sm text-gray-600 hover:bg-gray-50">Cancel</button>
          <button type="submit"
            class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700">Save as
            Draft</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Post Modal -->
<div id="editPostModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-lg p-6 relative">
    <button onclick="closeEditModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
    <h2 class="text-lg font-bold text-gray-800 mb-4">Edit Post</h2>
    
    <form id="editPostForm" onsubmit="handleEditPost(event)" class="space-y-4">
      <input type="hidden" id="editPostId">
      
      <div>
        <label class="block text-xs font-medium text-gray-700">Title</label>
        <input type="text" id="editPostTitle" required class="w-full mt-1 p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-700">Content</label>
        <textarea id="editPostContent" rows="4" required class="w-full mt-1 p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-700">Tags (comma separated)</label>
        <input type="text" id="editPostTags" class="w-full mt-1 p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>
      
      <div class="flex justify-end space-x-3 pt-2">
        <button type="button" onclick="closeEditModal()" class="px-4 py-2 border rounded-lg text-sm text-gray-600 hover:bg-gray-50">Cancel</button>
        <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700">Save Changes</button>
      </div>
    </form>
  </div>
</div>
</body>

</html>
